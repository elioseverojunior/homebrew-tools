name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  tap-syntax:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Homebrew gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-
      - name: Style and audit
        run: brew test-bot --only-tap-syntax

  install:
    needs: tap-syntax
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
          - os: macos-15-intel
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install and test the formulae
        run: |
          for formula in tmq nvmrc tgenv-manager; do
            brew install "elioseverojunior/tools/${formula}"
            brew test "elioseverojunior/tools/${formula}"
          done
      - name: Install and check tflint cask
        if: runner.os == 'macOS'
        run: |
          brew install --cask elioseverojunior/tools/tflint
          tflint --version

  generated-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check the generated files against their templates
        run: mise run homebrew:check
