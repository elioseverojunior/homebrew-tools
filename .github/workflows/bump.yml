name: bump

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report outdated formulae and casks without opening PRs"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  # Fails early and clearly when a branch rule would otherwise break the bump
  # jobs late and obscurely.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the bump branch rules
        run: |
          set +x
          readme="see the 'Automated bumps' section of the README"

          # Only repository rulesets are readable here. Classic branch
          # protection patterns need admin rights to read, so they are only
          # documented in the README.
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/bump%2Fpreflight-probe" --jq '.[].type')"
          echo "rule types for bump branches: ${rules:-none}"
          for blocking in creation update; do
            if grep -qx "${blocking}" <<< "${rules}"; then
              echo "::error::a ruleset with the '${blocking}' rule blocks bump/* branches; ${readme}"
              exit 1
            fi
          done

  # Regenerates every formula and cask from packaging/homebrew/ and opens one PR
  # per tool. The commit is made through the GraphQL API, so GitHub signs it as
  # github-actions[bot] and it shows as verified without a signing key.
  render-templates:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      # actions: write dispatches the tests workflow on the bump branch.
      actions: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        tool: [tmq, tflint, nvmrc, tgenv-manager]
    env:
      TOOL: ${{ matrix.tool }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always branch from the default branch, even when dispatched elsewhere.
          ref: ${{ github.event.repository.default_branch }}
          # Nothing is pushed with git: the commit goes through the API.
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Render the template
        id: render
        env:
          # Read-only lookup of public releases.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only stdout is captured; mise and the script log to stderr.
          mise run homebrew:render "${TOOL}" > "${RUNNER_TEMP}/render-${TOOL}.txt"
          version="$(sed -n 's/^version \([0-9][0-9.]*\)$/\1/p' "${RUNNER_TEMP}/render-${TOOL}.txt" | tail -n 1)"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "no valid version rendered" >&2; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Open the bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          case "${TOOL}" in
            tmq) generated="Formula/t/tmq.rb" ;;
            tflint) generated="Casks/tflint.rb" ;;
            nvmrc) generated="Formula/n/nvmrc.rb" ;;
            tgenv-manager) generated="Formula/t/tgenv-manager.rb" ;;
            *) echo "unknown tool" >&2; exit 1 ;;
          esac
          if [ -z "$(git status --porcelain -- "${generated}")" ]; then
            echo "${TOOL} ${VERSION} is already rendered; nothing to do"
            exit 0
          fi

          branch="bump/${TOOL}-${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --silent 2> /dev/null; then
            echo "branch ${branch} already exists on the remote; skipping"
            exit 0
          fi

          title="chore(${TOOL}): bump to ${VERSION}"
          body="${RUNNER_TEMP}/body-${TOOL}.md"
          {
            echo "Rendered \`${generated}\` for ${TOOL} ${VERSION}."
            echo
            echo "| placeholder | sha256 | source |"
            echo "| --- | --- | --- |"
            sed -n 's/^\(SHA256_[A-Z0-9_]*\) \([0-9a-f]\{64\}\) \(checksums\.txt\|SHA256SUMS\|downloaded\)$/| \1 | \2 | \3 |/p' "${RUNNER_TEMP}/render-${TOOL}.txt"
            if grep -q ' downloaded$' "${RUNNER_TEMP}/render-${TOOL}.txt"; then
              echo
              echo "WARNING: the hashes with source \`downloaded\` are trust-on-first-download:"
              echo "upstream publishes no checksums for them. Verify them before merging."
            fi
          } > "${body}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run: would push ${branch} and open a PR titled: ${title}"
            git diff --stat -- "${generated}"
            cat "${body}"
            exit 0
          fi

          # createCommitOnBranch commits as the token's identity, and GitHub
          # signs commits it creates for github-actions[bot].
          base="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${branch}" -f sha="${base}" --silent
          # $input is a GraphQL variable, not a shell one.
          # shellcheck disable=SC2016
          query='mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }'
          jq -n \
            --arg query "${query}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${branch}" \
            --arg base "${base}" \
            --arg headline "${title}" \
            --arg path "${generated}" \
            --arg contents "$(base64 -w 0 "${generated}")" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $base,
              message: {headline: $headline},
              fileChanges: {additions: [{path: $path, contents: $contents}]}
            }}}' \
            | gh api graphql --input - --jq .data.createCommitOnBranch.commit.url
          gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}"
          # Events caused by GITHUB_TOKEN start no workflows, except
          # workflow_dispatch: run the tests on the branch so the PR gets checks.
          gh workflow run tests.yml --ref "${branch}"
