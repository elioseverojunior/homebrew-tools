name: bump

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report outdated formulae and casks without opening PRs"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  # Fails early and clearly when the PAT, its push right or a branch rule would
  # otherwise break the bump jobs late and obscurely.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
      HAS_SIGNING_KEY: ${{ secrets.BUMP_SIGNING_KEY != '' }}
    steps:
      - name: Check the token and the bump branch rules
        run: |
          set +x
          readme="see the 'Automated bumps' section of the README"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMEBREW_GITHUB_API_TOKEN is empty; ${readme}"
            exit 1
          fi

          push="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .permissions.push)"
          if [ "${push}" != "true" ]; then
            echo "::error::HOMEBREW_GITHUB_API_TOKEN cannot push to ${GITHUB_REPOSITORY}; ${readme}"
            exit 1
          fi

          # Only repository rulesets are readable here. Classic branch
          # protection patterns need admin rights to read, so they are only
          # documented in the README.
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/bump%2Fpreflight-probe" --jq '.[].type')"
          echo "rule types for bump branches: ${rules:-none}"
          for blocking in creation update; do
            if grep -qx "${blocking}" <<< "${rules}"; then
              echo "::error::a ruleset with the '${blocking}' rule blocks bump/* branches; ${readme}"
              exit 1
            fi
          done
          if grep -qx required_signatures <<< "${rules}" && [ "${HAS_SIGNING_KEY}" != "true" ]; then
            echo "::error::a ruleset requires signed commits but BUMP_SIGNING_KEY is not set; ${readme}"
            exit 1
          fi

  bump:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.28.1

      - name: Set up git
        id: git-setup
        uses: Homebrew/actions/git-user-config@2026.09.28.1

      - name: Bump formulae and casks
        env:
          # A PAT is required: PRs opened with GITHUB_TOKEN do not trigger the
          # tests workflow.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git-setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git-setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # tmq and tflint are template-generated by render-templates, so only
          # tgenv-manager is bumped here. A formula argument and --tap are not
          # combined: brew bump resolves --tap first and would ignore the
          # argument, so the formula is passed fully qualified instead.
          args=(--no-fork)
          if [ "${DRY_RUN}" != "true" ]; then
            args+=(--open-pr)
          fi
          brew bump "${args[@]}" "${TAP_NAME}/tgenv-manager"

  # Regenerates the tmq formula and the tflint cask from packaging/homebrew/ and
  # opens one PR per tool. The commit is SSH-signed when BUMP_SIGNING_KEY is set;
  # otherwise it is unsigned and the PR must be squash-merged so GitHub signs it.
  render-templates:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        tool: [tmq, tflint]
    env:
      TOOL: ${{ matrix.tool }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          # Always branch from the default branch, even when dispatched elsewhere.
          ref: ${{ github.event.repository.default_branch }}
          # A PAT is required: PRs opened with GITHUB_TOKEN do not trigger the
          # tests workflow.
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          # The later git push reuses the credentials persisted by checkout.
          persist-credentials: true

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Render the template
        id: render
        env:
          # Read-only lookup of public releases; the PAT is not needed here.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only stdout is captured; mise and the script log to stderr.
          mise run homebrew:render "${TOOL}" > "${RUNNER_TEMP}/render-${TOOL}.txt"
          version="$(sed -n 's/^version \([0-9][0-9.]*\)$/\1/p' "${RUNNER_TEMP}/render-${TOOL}.txt" | tail -n 1)"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "no valid version rendered" >&2; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Configure commit signing
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.BUMP_SIGNING_KEY }}
          COMMIT_NAME: ${{ vars.BUMP_COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.BUMP_COMMIT_EMAIL }}
        run: |
          # Tracing stays off for the whole step: -x would print the key.
          set +x
          if [ -n "${SIGNING_KEY}" ]; then
            if [ -z "${COMMIT_NAME}" ] || [ -z "${COMMIT_EMAIL}" ]; then
              echo "::error::BUMP_SIGNING_KEY needs the BUMP_COMMIT_NAME and BUMP_COMMIT_EMAIL variables"
              exit 1
            fi
            key_file="${RUNNER_TEMP}/bump-signing-key"
            (umask 077 && printf '%s\n' "${SIGNING_KEY}" > "${key_file}")
            git config gpg.format ssh
            git config user.signingkey "${key_file}"
            git config commit.gpgsign true
            git config user.name "${COMMIT_NAME}"
            git config user.email "${COMMIT_EMAIL}"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::BUMP_SIGNING_KEY is not set; the bump commit will be unsigned"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open the bump pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          VERSION: ${{ steps.render.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          case "${TOOL}" in
            tmq) generated="Formula/t/tmq.rb" ;;
            tflint) generated="Casks/tflint.rb" ;;
            *) echo "unknown tool" >&2; exit 1 ;;
          esac
          if [ -z "$(git status --porcelain -- "${generated}")" ]; then
            echo "${TOOL} ${VERSION} is already rendered; nothing to do"
            exit 0
          fi

          branch="bump/${TOOL}-${VERSION}"
          if git ls-remote --exit-code --heads origin "${branch}" > /dev/null; then
            echo "branch ${branch} already exists on the remote; skipping"
            exit 0
          fi

          title="chore(${TOOL}): bump to ${VERSION}"
          body="${RUNNER_TEMP}/body-${TOOL}.md"
          {
            echo "Rendered \`${generated}\` for ${TOOL} ${VERSION}."
            echo
            echo "| placeholder | sha256 | source |"
            echo "| --- | --- | --- |"
            sed -n 's/^\(SHA256_[A-Z0-9_]*\) \([0-9a-f]\{64\}\) \(checksums\.txt\|downloaded\)$/| \1 | \2 | \3 |/p' "${RUNNER_TEMP}/render-${TOOL}.txt"
            if grep -q ' downloaded$' "${RUNNER_TEMP}/render-${TOOL}.txt"; then
              echo
              echo "WARNING: the hashes with source \`downloaded\` are trust-on-first-download:"
              echo "upstream publishes no checksums for them. Verify them before merging."
            fi
            echo
            if [ "${SIGNED}" = "true" ]; then
              echo "Commit signature: signed (SSH)"
            else
              echo "Commit signature: unsigned — squash-merge this PR so GitHub signs the merge commit"
            fi
          } > "${body}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run: would push ${branch} and open a PR titled: ${title}"
            git diff --stat -- "${generated}"
            cat "${body}"
            exit 0
          fi

          commit_args=()
          if [ "${SIGNED}" = "true" ]; then
            commit_args+=(-S)
          fi
          git switch -c "${branch}"
          git add -- "${generated}"
          git commit "${commit_args[@]}" -m "${title}"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}"

      - name: Remove the signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/bump-signing-key"
