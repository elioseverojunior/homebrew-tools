name: verify-generated

on:
  pull_request:
    paths:
      - Formula/n/nvmrc.rb
      - Formula/t/tgenv-manager.rb
      - Formula/t/tmq.rb
      - Casks/tflint.rb
      - packaging/homebrew/**
      - scripts/render-homebrew.sh
      - .github/workflows/verify-generated.yml
  push:
    branches:
      - main
    paths:
      - Formula/n/nvmrc.rb
      - Formula/t/tgenv-manager.rb
      - Formula/t/tmq.rb
      - Casks/tflint.rb
      - packaging/homebrew/**
      - scripts/render-homebrew.sh
      - .github/workflows/verify-generated.yml
  schedule:
    # Weekly: also catches an upstream re-upload of an already released asset.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Check the generated files against templates and upstream
        run: mise run homebrew:check --online
